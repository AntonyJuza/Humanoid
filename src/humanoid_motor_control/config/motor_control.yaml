cytron_controller_node:
  ros__parameters:
    # GPIO pins for Cytron motor controller
    rc1_pin: 12
    rc2_pin: 13

    # Motor trim configuration:
    # left_trim / right_trim: multipliers for left and right motors (default: 1.0)
    # e.g., if the robot veers right, decrease left_trim (e.g. 0.95) or increase right_trim (e.g. 1.05)
    left_trim: 1.0
    right_trim: 1.0
    # trim: differential steering trim from -1.0 (left bias) to 1.0 (right bias) (default: 0.0)
    trim: 0.0

    # Robot dimensions — matched to URDF (wheel y_reflect * 0.115 * 2)
    wheel_base: 0.23
    wheel_radius: 0.045

    # Motor configuration
    max_speed: 100
    publish_rate: 50.0

    # Encoder parameters
    encoder_pins: [18, 19]
    pulses_per_revolution: 20

    # IMPORTANT: publish_tf = false
    # EKF (robot_localization) owns the odom→base_link TF.
    # Having two nodes broadcast the same TF causes map corruption.
    publish_tf: false
    base_frame: "base_footprint"
    odom_frame: "odom"

cytron_controller:
  ros__parameters:
    # GPIO pins for Cytron motor controller
    rc1_pin: 12
    rc2_pin: 13

    # Motor trim configuration:
    # left_trim / right_trim: multipliers for left and right motors (default: 1.0)
    # e.g., if the robot veers right, decrease left_trim (e.g. 0.95) or increase right_trim (e.g. 1.05)
    left_trim: 1.0
    right_trim: 0.80  
    # trim: differential steering trim from -1.0 (left bias) to 1.0 (right bias) (default: 0.0)
    trim: 0.0

    # Robot dimensions — matched to URDF (wheel y_reflect * 0.115 * 2)
    wheel_base: 0.23
    wheel_radius: 0.045

    # Motor configuration
    max_speed: 100
    publish_rate: 50.0

    # Encoder parameters
    encoder_pins: [18, 19]
    pulses_per_revolution: 20

    publish_tf: false
    base_frame: "base_footprint"
    odom_frame: "odom"

diff_drive_controller:
  ros__parameters:
    wheel_base: 0.23        # matched to URDF
    wheel_radius: 0.045     # matched to URDF
    publish_tf: false       # EKF owns odom→base_link TF
    base_frame: "base_footprint"
    odom_frame: "odom"